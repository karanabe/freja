[package]
name = "freja"
description = "Command-line bootstrap, validation, and replay interface for Freja"
readme = "README.md"
keywords = ["freja", "proxy", "security", "networking", "inspection"]
categories = ["command-line-utilities", "network-programming"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "freja"
path = "src/main.rs"

[dependencies]
clap.workspace = true
freja-audit.workspace = true
freja-config.workspace = true
freja-domain.workspace = true
freja-policy.workspace = true
freja-proxy.workspace = true
freja-ui = { workspace = true, features = ["tui"] }
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
