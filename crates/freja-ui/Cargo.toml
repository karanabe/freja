[package]
name = "freja-ui"
description = "Bounded event publishing and optional terminal interface for Freja"
readme = "README.md"
keywords = ["freja", "proxy", "tui", "ratatui"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
tui = ["dep:freja-policy", "dep:http", "dep:ratatui"]

[dependencies]
freja-domain.workspace = true
freja-policy = { workspace = true, optional = true }
http = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true
