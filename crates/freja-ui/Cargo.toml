[package]
name = "freja-ui"
description = "Bounded event publishing and optional terminal interface for Freja"
readme = "README.md"
keywords = ["freja", "proxy", "tui", "ratatui"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
tui = [
    "dep:http",
    "dep:httparse",
    "dep:ratatui",
    "dep:serde_json",
    "dep:vim-navigation",
]

[dependencies]
freja-domain.workspace = true
freja-policy.workspace = true
http = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
vim-navigation = { workspace = true, optional = true }

[lints]
workspace = true
