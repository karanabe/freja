[package]
name = "freja-proxy"
description = "Tokio and Pingora transport adapters for Freja data-plane engines"
readme = "README.md"
keywords = ["freja", "proxy", "http", "socks5", "networking"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
pingora-adapter = ["dep:async-trait", "dep:pingora-core"]

[dependencies]
arc-swap.workspace = true
async-trait = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
freja-audit.workspace = true
freja-domain.workspace = true
freja-policy.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pingora-core = { workspace = true, optional = true }
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[lints]
workspace = true
